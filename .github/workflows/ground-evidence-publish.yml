name: GROUND isolated Evidence publisher
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: auth
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.repository == 'shulovm/seiri-ai-frontend' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    environment: ground-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ground-evidence-bundle-${{ github.run_attempt }}
          path: bundle
      - name: Verify actual custom OIDC subject before exchange
        run: python3 control/scripts/azure/ground-evidence-run.py subject
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.GROUND_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.GROUND_TENANT_ID }}
          subscription-id: ${{ vars.GROUND_SUBSCRIPTION_ID }}
      - name: Verify signed-in identity and full existing release before chosen operation
        env:
          PUBLISH_MODE: ${{ inputs.mode }}
        run: python3 control/scripts/azure/ground-evidence-run.py "$PUBLISH_MODE" --bundle bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ground-evidence-publication-${{ github.run_attempt }}
          path: evidence/publisher
          if-no-files-found: error
          retention-days: 90
