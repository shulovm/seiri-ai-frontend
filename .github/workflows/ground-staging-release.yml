name: GROUND isolated staging deployer
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    if: github.repository == 'shulovm/seiri-ai-frontend' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ground-staging
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ground-image-${{ github.run_attempt }}
          path: image-artifact
      - name: Require explicit verified deployment baseline
        env:
          STAGING_BASELINE: ${{ vars.GROUND_STAGING_BASELINE_JSON }}
        run: |
          python3 -c 'import json,os,pathlib; b=json.loads(os.environ["STAGING_BASELINE"]); assert b["contract"] and b["worker_roles"]; pathlib.Path("baseline.json").write_text(json.dumps(b))'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.GROUND_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.GROUND_TENANT_ID }}
          subscription-id: a0d869a1-8cdc-4b87-891c-9d92dd52320d
      - name: Guarded deploy and exact runtime verification
        run: python3 control/scripts/azure/ground-staging-deploy.py --baseline baseline.json --image image-artifact/image.json --evidence evidence/deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ground-deployment-${{ github.run_attempt }}
          path: evidence/deploy
          retention-days: 90
