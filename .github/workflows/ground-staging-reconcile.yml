name: GROUND reconcile verified original push and deploy
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact original tested source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ground-staging-deployment
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/azure -p 'test_*.py' -v
  deploy:
    needs: guards
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/ground-staging-release.yml
    with:
      execute: true
      reconcile_build: true
      source_commit: ${{ inputs.source_commit }}
