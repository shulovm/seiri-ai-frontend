name: GROUND isolated image builder
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      corpus_release:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  build:
    if: github.repository == 'shulovm/seiri-ai-frontend' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ground-staging
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_commit }}
      CORPUS_RELEASE: ${{ inputs.corpus_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Build clean source context before Azure login
        run: python3 control/scripts/azure/ground-staging-build.py build --source source --sha "$SOURCE_SHA" --release "$CORPUS_RELEASE" --evidence evidence/build
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.GROUND_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.GROUND_TENANT_ID }}
          subscription-id: a0d869a1-8cdc-4b87-891c-9d92dd52320d
      - name: Publish and resolve immutable digest
        run: python3 control/scripts/azure/ground-staging-build.py push --source source --sha "$SOURCE_SHA" --release "$CORPUS_RELEASE" --evidence evidence/build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ground-image-${{ github.run_attempt }}
          path: evidence/build
          retention-days: 90
